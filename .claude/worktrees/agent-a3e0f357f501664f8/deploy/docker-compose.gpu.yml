# BẢN CÀI TRÊN MÁY CÓ GPU NVIDIA (E74). Ghép CHỒNG lên docker-compose.yml:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml up -d --build
#
# Cần: driver NVIDIA + NVIDIA Container Toolkit (Linux) hoặc Docker Desktop bật GPU (Windows/WSL2).
# Hướng dẫn đầy đủ: docs/CAI_DAT_CUC_BO.md. Production KHÔNG dùng tệp này.
services:
  worker:
    build:
      context: ../backend
      target: worker-gpu
      args:
        TORCH_CUDA: ${TORCH_CUDA:-cu126}
    environment:
      # Bản cài GPU thì xoá chữ bằng SDXL. Muốn LaMa (CPU) thì bỏ tệp này đi, đừng sửa dòng này.
      INPAINT_ENGINE: khuech_tan
    # E72 — để worker gọi được Ollama / LM Studio / llama.cpp đang chạy trên MÁY CHỦ (host).
    # Docker Desktop tự có tên này; Linux thì cần dòng dưới.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
