name: translation

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-translation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-translation}
      POSTGRES_DB: ${POSTGRES_DB:-translation}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-translation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: base
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      target: worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
      - ./models:/models:ro
      # M6: font chèn chữ. Chỉ worker cần — API không nạp engine render.
      - ./fonts:/fonts:ro
      - model_cache:/model-cache
    # M2/M3: worker tiêu thụ Job(type=detect) và Job(type=ocr) bằng comic-text-detector (ONNX, CPU).
    command: celery -A app.workers.celery_app.celery_app worker -l info -Q celery --concurrency=1

volumes:
  db_data:
  storage_data:
  model_cache:
